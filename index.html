<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabaña Pura Vida - Lofi Rain & Chill</title>
    <!-- FUENTE RETRO PIXEL ART -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Silkscreen', cursive, monospace;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #05070a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: 1000px;
            height: 700px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
            border-radius: 12px;
            overflow: hidden;
            border: 6px solid #2b1a0d;
        }

        #game-container canvas {
            image-rendering: pixelated; 
        }

        /* OVERLAY DE LOGIN */
        #login-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 12, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #ffffff;
        }

        .login-box {
            background: #2b1d14;
            padding: 35px;
            border-radius: 14px;
            border: 4px solid #b87333;
            box-shadow: inset 0 0 20px #000000, 0 12px 30px rgba(0,0,0,0.85);
            text-align: center;
            width: 380px;
        }

        .login-box h2 {
            margin-top: 0;
            color: #2ecc71;
            font-size: 20px;
            text-shadow: 2px 2px #000;
            margin-bottom: 22px;
        }

        .login-box label {
            display: block;
            text-align: left;
            font-size: 10px;
            color: #d5b895;
            margin: 6px 0 2px 2px;
        }

        .login-box input, .login-box select, .login-box button {
            width: 100%;
            padding: 12px;
            margin: 4px 0 10px 0;
            border-radius: 6px;
            border: 2px solid #5c3a21;
            background: #140d08;
            color: #f1c40f;
            font-size: 12px;
            outline: none;
        }

        .login-box button {
            background: #27ae60;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #2ecc71;
            transition: 0.2s;
            margin-top: 15px;
        }

        .login-box button:hover {
            background: #2ecc71;
            color: #140d08;
        }

        /* BARRA INFERIOR - MEJORADA CON ESTILO RETRO BLOCK */
        #ui-bar {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 96%;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 999;
        }

        #chat-input {
            flex: 1;
            padding: 12px 18px;
            font-size: 11px;
            border: 3px solid #b87333;
            border-radius: 8px;
            background-color: rgba(20, 13, 8, 0.95);
            color: #ffffff;
            outline: none;
            box-shadow: 4px 4px 0px #000000;
        }

        .emote-btn, .tool-btn {
            background: #140d08;
            border: 3px solid #b87333;
            border-radius: 8px;
            width: 42px;
            height: 42px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.2s, box-shadow 0.1s;
            box-shadow: 4px 4px 0px #000000;
            color: #fff;
        }

        .emote-btn:hover, .tool-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
            background: #d35400;
        }

        .emote-btn:active, .tool-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        /* HISTORIAL DE CHAT */
        #chat-history-box {
            position: absolute;
            top: 20px; right: 20px;
            width: 280px; height: 220px;
            background: rgba(20, 13, 8, 0.94);
            border: 3px solid #b87333;
            border-radius: 8px;
            padding: 10px;
            display: none;
            flex-direction: column;
            z-index: 998;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.9);
        }

        #chat-history-header {
            font-size: 11px; color: #f1c40f;
            border-bottom: 2px solid #5c3a21;
            padding-bottom: 4px; margin-bottom: 6px;
            display: flex; justify-content: space-between;
        }

        #chat-history-list {
            flex: 1; overflow-y: auto;
            font-size: 10px; color: #e0e0e0;
            display: flex; flex-direction: column; gap: 4px;
        }

        #chat-history-list div {
            word-break: break-word;
            line-height: 1.3;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

    <div id="game-wrapper">
        <div id="login-overlay">
            <div class="login-box">
                <h2>🇨🇷 Cabaña Pura Vida</h2>
                <label>Tu Nombre:</label>
                <input type="text" id="username-input" placeholder="Ej. Ronald" maxlength="12" autocomplete="off">
                
                <label>Color de Túnica:</label>
                <select id="color-select">
                    <option value="purple">Túnica Morada</option>
                    <option value="blue">Túnica Azul</option>
                    <option value="red">Túnica Roja</option>
                    <option value="green">Túnica Verde</option>
                    <option value="yellow">Túnica Dorada</option>
                </select>

                <button id="start-btn">Entrar a la Cabaña</button>
            </div>
        </div>

        <div id="game-container"></div>

        <div id="chat-history-box">
            <div id="chat-history-header">
                <span>Historial de Chat</span>
                <span style="cursor:pointer;" onclick="toggleHistory()">✖</span>
            </div>
            <div id="chat-history-list"></div>
        </div>

        <div id="ui-bar" style="display: none;">
            <input type="text" id="chat-input" placeholder="ESCRIBE UN MENSAJE..." maxlength="40" autocomplete="off" />
            <button class="emote-btn" onclick="sendEmote('😀')">😀</button>
            <button class="emote-btn" onclick="sendEmote('😂')">😂</button>
            <button class="emote-btn" onclick="sendEmote('😎')">😎</button>
            <button class="emote-btn" onclick="sendEmote('😮')">😮</button>
            <button class="emote-btn" onclick="sendEmote('😡')">😡</button>
            <button class="emote-btn" onclick="sendEmote('😢')">😢</button>
            <button class="emote-btn" onclick="sendEmote('❤️')">❤️</button>
            <button class="tool-btn" onclick="toggleHistory()" title="Historial">📜</button>
            <button class="tool-btn" id="audio-toggle-btn" onclick="toggleAudio()" title="Sonido de Lluvia">🌧️</button>
        </div>
    </div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: 1000,
            height: 700,
            parent: 'game-container',
            pixelArt: true,
            physics: {
                default: 'arcade',
                arcade: { debug: false }
            },
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        let socket = null;
        let player = null;
        let targetPoint = null;
        const otherPlayers = {};
        const SPEED = 180;
        
        let dustParticles = [];
        let footstepDusts = [];
        let fireGlowGraphics;
        let lanternGlowGraphics;
        let clockPendulumContainer;
        let rainWindowGraphics;
        let windowJungleContainer;
        let fireSparksGraphics;
        let coffeeSteamGraphics;
        let slothArmGraphics;
        let slothEyeGraphics;

        let nextDustTime = 0;
        let audioContext = null;
        let rainNoiseNode = null;
        let isAudioPlaying = false;

        let rainParticles = [];
        let fireSparks = [];
        let coffeeSteam = [];

        const COLOR_MAP = {
            purple: { base: 0x8e44ad, shadow: 0x6c3483 },
            blue:   { base: 0x2980b9, shadow: 0x1f618d },
            red:    { base: 0xc0392b, shadow: 0x922b21 },
            green:  { base: 0x27ae60, shadow: 0x1e8449 },
            yellow: { base: 0xf39c12, shadow: 0xb9770e }
        };

        function preload() {
            Object.keys(COLOR_MAP).forEach(colorKey => {
                const g = this.make.graphics({ x: 0, y: 0, add: false });
                const colors = COLOR_MAP[colorKey];
                
                // Pelo
                g.fillStyle(0x4a235a); g.fillRect(10, 2, 12, 6);
                
                // Piel
                g.fillStyle(0xffdbac); g.fillRect(10, 7, 12, 9);
                g.fillStyle(0xe0ac69); g.fillRect(10, 14, 12, 2);
                g.fillStyle(0x2c3e50); g.fillRect(12, 10, 2, 3); g.fillRect(18, 10, 2, 3);
                
                // Túnica
                g.fillStyle(colors.base); g.fillRect(8, 16, 16, 10);
                g.fillStyle(colors.shadow); g.fillRect(18, 16, 6, 10); g.fillRect(8, 24, 16, 2);
                
                // Pantalones y Botas
                g.fillStyle(0x2c3e50); g.fillRect(10, 26, 12, 5);
                g.fillStyle(0x1a100b); g.fillRect(9, 29, 5, 3); g.fillRect(18, 29, 5, 3);

                g.generateTexture(`human_${colorKey}`, 32, 32);
            });

            // Sombra ovalada
            const shG = this.make.graphics({ x: 0, y: 0, add: false });
            shG.fillStyle(0x000000, 0.38);
            shG.fillEllipse(18, 9, 18, 7);
            shG.generateTexture('avatar_shadow', 36, 18);
        }

        function create() {
            const self = this;

            // Gotas de Lluvia
            for (let i = 0; i < 40; i++) {
                rainParticles.push({
                    x: Phaser.Math.Between(170, 370),
                    y: Phaser.Math.Between(22, 127),
                    length: Phaser.Math.Between(8, 16),
                    speed: Phaser.Math.FloatBetween(2.8, 5.0)
                });
            }

            // Chispas Chimenea
            for (let i = 0; i < 14; i++) {
                fireSparks.push({
                    x: 500 + Phaser.Math.Between(-14, 14),
                    y: 95,
                    vy: Phaser.Math.FloatBetween(0.5, 1.1),
                    vx: Phaser.Math.FloatBetween(-0.3, 0.3),
                    alpha: Phaser.Math.FloatBetween(0.5, 1.0),
                    size: Phaser.Math.Between(1, 3)
                });
            }

            // Vapor Café
            for (let i = 0; i < 6; i++) {
                coffeeSteam.push({
                    x: 658,
                    y: 360 - (i * 5),
                    alpha: 1 - (i * 0.16),
                    seed: Math.random() * 50
                });
            }

            drawCostaRicaCabin(this);

            // EVENTOS DE ENTRADA / LOGIN
            const startBtn = document.getElementById('start-btn');
            const usernameInput = document.getElementById('username-input');

            const handleLogin = () => {
                if (socket) return;
                const name = usernameInput.value.trim() || 'Tico';
                const color = document.getElementById('color-select').value;
                
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('ui-bar').style.display = 'flex';

                socket = io();
                setupSocketListeners(self);
                socket.emit('joinRoom', { name, color });
                initRainAudio();
            };

            startBtn.addEventListener('click', handleLogin);
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            // CLIC Y MECÁNICA PARA SENTARSE
            this.input.on('pointerdown', (pointer) => {
                if (pointer.y > 620 || pointer.y < 140) return;

                if (player && targetPoint) {
                    let targetX = pointer.x;
                    let targetY = pointer.y;

                    if (pointer.x >= 200 && pointer.x <= 500 && pointer.y >= 320 && pointer.y <= 440) {
                        if (pointer.x < 290) targetX = 250;
                        else if (pointer.x < 390) targetX = 350;
                        else targetX = 450;
                        
                        targetY = 375;
                    }

                    targetPoint.x = targetX;
                    targetPoint.y = targetY;
                    self.physics.moveToObject(player, targetPoint, SPEED);
                    socket.emit('playerMovement', { x: targetX, y: targetY });
                    player.setScale(2.6, 2.0);
                }
            });

            const chatInput = document.getElementById('chat-input');
            
            chatInput.addEventListener('focus', () => {
                if (socket) socket.emit('typingState', true);
                if (socket) setTypingIndicator(self, socket.id, true);
            });

            chatInput.addEventListener('blur', () => {
                if (socket) socket.emit('typingState', false);
                if (socket) setTypingIndicator(self, socket.id, false);
            });

            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const msg = chatInput.value.trim();
                    if (msg.length > 0 && socket) {
                        socket.emit('chatMessage', msg);
                        chatInput.value = '';
                        chatInput.blur();
                    }
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    const box = document.getElementById('chat-history-box');
                    if (box.style.display === 'flex') box.style.display = 'none';
                }
            });

            createDustParticles(this);
        }

        function setupSocketListeners(scene) {
            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach((id) => {
                    if (players[id].playerId === socket.id) {
                        addLocalPlayer(scene, players[id]);
                    } else {
                        addOtherPlayer(scene, players[id]);
                    }
                });
            });

            socket.on('newPlayer', (playerInfo) => {
                addOtherPlayer(scene, playerInfo);
            });

            socket.on('playerMoved', (playerInfo) => {
                if (otherPlayers[playerInfo.playerId]) {
                    const other = otherPlayers[playerInfo.playerId];
                    other.targetPoint = new Phaser.Math.Vector2(playerInfo.x, playerInfo.y);
                    scene.physics.moveToObject(other, other.targetPoint, SPEED);
                }
            });

            socket.on('disconnectPlayer', (playerId) => {
                if (otherPlayers[playerId]) {
                    removeCharacterBubbles(otherPlayers[playerId]);
                    if (otherPlayers[playerId].nameTag) otherPlayers[playerId].nameTag.destroy();
                    if (otherPlayers[playerId].shadow) otherPlayers[playerId].shadow.destroy();
                    otherPlayers[playerId].destroy();
                    delete otherPlayers[playerId];
                }
            });

            socket.on('chatMessage', (data) => {
                showSpeechBubble(scene, data.id, data.text);
                addHistoryLog(data.name || 'Jugador', data.text);
            });

            socket.on('emoteMessage', (data) => {
                showEmoteBubble(scene, data.id, data.emote);
                addHistoryLog(data.name || 'Jugador', data.emote);
            });

            socket.on('playerTyping', (data) => {
                setTypingIndicator(scene, data.id, data.isTyping);
            });
        }

        function update() {
            const time = this.time.now;
            const winX = 170, winY = 22, winW = 200, winH = 105;

            // 1. LLUVIA ANIMADA
            if (rainWindowGraphics) {
                rainWindowGraphics.clear();
                rainWindowGraphics.lineStyle(1.5, 0xdfe6e9, 0.65);
                rainParticles.forEach(p => {
                    p.y += p.speed;
                    p.x -= p.speed * 0.25;
                    if (p.y > winY + winH) {
                        p.y = winY;
                        p.x = Phaser.Math.Between(winX, winX + winW + 20);
                    }
                    rainWindowGraphics.lineBetween(p.x, p.y, p.x - (p.length * 0.2), p.y + p.length);
                });
            }

            // 2. SELVA TROPICAL
            if (windowJungleContainer) {
                const sway1 = Math.sin(time / 600) * 3;
                const sway2 = Math.cos(time / 500) * 2.5;
                if (windowJungleContainer.leaf1) windowJungleContainer.leaf1.x = winX + 30 + sway1;
                if (windowJungleContainer.leaf2) windowJungleContainer.leaf2.x = winX + 170 + sway2;
                if (windowJungleContainer.leaf3) windowJungleContainer.leaf3.x = winX + 100 + sway1 * 0.5;
            }

            // 3. CHISPAS CHIMENEA
            if (fireSparksGraphics) {
                fireSparksGraphics.clear();
                fireSparks.forEach(s => {
                    s.y -= s.vy;
                    s.x += s.vx + Math.sin(time / 140) * 0.3;
                    s.alpha -= 0.012;
                    if (s.alpha <= 0 || s.y < 55) {
                        s.x = 500 + Phaser.Math.Between(-14, 14);
                        s.y = 95;
                        s.alpha = 1;
                        s.vy = Phaser.Math.FloatBetween(0.5, 1.1);
                    }
                    fireSparksGraphics.fillStyle(0xffa500, s.alpha);
                    fireSparksGraphics.fillRect(s.x, s.y, s.size, s.size);
                });
            }

            // 4. VAPOR CAFÉ
            if (coffeeSteamGraphics) {
                coffeeSteamGraphics.clear();
                coffeeSteam.forEach(p => {
                    p.y -= 0.25;
                    p.x = 658 + Math.sin((time / 180) + p.seed) * 3.0;
                    p.alpha -= 0.01;
                    if (p.alpha <= 0 || p.y < 320) {
                        p.y = 360;
                        p.x = 658;
                        p.alpha = 0.85;
                    }
                    coffeeSteamGraphics.fillStyle(0xffffff, p.alpha * 0.4);
                    coffeeSteamGraphics.fillCircle(p.x, p.y, 2.0);
                });
            }

            // 5. PEREZOSO ANIMADO
            if (slothArmGraphics && slothEyeGraphics) {
                const blink = Math.sin(time / 900) > 0.95;
                const armMove = Math.sin(time / 500) * 1.5;
                slothArmGraphics.y = armMove;
                slothEyeGraphics.clear();
                slothEyeGraphics.fillStyle(blink ? 0x8d5b28 : 0x000000);
                slothEyeGraphics.fillRect(604, 70, 2, 2);
                slothEyeGraphics.fillRect(613, 70, 2, 2);
            }

            // 6. LUZ Y PARPADEOS (Con soporte para Additive Blend)
            if (fireGlowGraphics) {
                fireGlowGraphics.alpha = 0.4 + Math.sin(time / 80) * 0.12 + (Math.random() * 0.04);
            }

            if (lanternGlowGraphics) {
                lanternGlowGraphics.alpha = 0.35 + Math.sin(time / 90) * 0.08;
            }

            // 7. RELOJ DE PÉNDULO
            if (clockPendulumContainer) {
                clockPendulumContainer.rotation = Math.sin(time / 220) * 0.25;
            }

            // MOVIMIENTO Y PROFUNDIDAD DEL JUGADOR
            if (player && targetPoint) {
                const dist = Phaser.Math.Distance.Between(player.x, player.y, targetPoint.x, targetPoint.y);
                
                if (dist > 4) {
                    player.angle = Math.sin(time / 50) * 5;
                    player.scaleX = Phaser.Math.Linear(player.scaleX, 2.4, 0.15);
                    player.scaleY = Phaser.Math.Linear(player.scaleY, 2.4, 0.15);
                    player.setFlipX(targetPoint.x < player.x);

                    if (time > nextDustTime) {
                        spawnFootstepDust(this, player.x, player.y + 28);
                        nextDustTime = time + 130;
                    }
                } else {
                    if (player.body.speed > 0) {
                        player.setScale(2.1, 2.6);
                    }
                    player.body.reset(targetPoint.x, targetPoint.y);
                    player.angle = 0;

                    if (player.y === 375 && player.x >= 240 && player.x <= 460) {
                        player.scaleX = 2.4;
                        player.scaleY = 2.0;
                    } else {
                        player.scaleX = Phaser.Math.Linear(player.scaleX, 2.4, 0.1);
                        player.scaleY = Phaser.Math.Linear(player.scaleY, 2.4 + Math.sin(time / 250) * 0.06, 0.1);
                    }
                }

                player.depth = player.y;
                if (player.shadow) { player.shadow.setPosition(player.x, player.y + 28); player.shadow.depth = player.y - 1; }
                if (player.nameTag) { player.nameTag.setPosition(player.x, player.y + 36); player.nameTag.depth = player.y + 1000; }
                if (player.chatBubble) { player.chatBubble.setPosition(player.x, player.y - 50); player.chatBubble.depth = 9999; }
                if (player.typingBubble) { 
                    player.typingBubble.setPosition(player.x, player.y - 50); 
                    player.typingBubble.depth = 9998; 
                    animateTypingDots(player.typingBubble, time);
                }
            }

            // OTROS JUGADORES
            Object.keys(otherPlayers).forEach((id) => {
                const other = otherPlayers[id];
                if (other.targetPoint) {
                    const dist = Phaser.Math.Distance.Between(other.x, other.y, other.targetPoint.x, other.targetPoint.y);
                    if (dist > 4) {
                        other.angle = Math.sin(time / 50) * 5;
                        other.setScale(2.4, 2.4);
                        other.setFlipX(other.targetPoint.x < other.x);
                    } else {
                        other.body.reset(other.targetPoint.x, other.targetPoint.y);
                        other.angle = 0;
                        other.setScale(2.4, 2.4 + Math.sin(time / 250) * 0.06);
                    }
                }

                other.depth = other.y;
                if (other.shadow) { other.shadow.setPosition(other.x, other.y + 28); other.shadow.depth = other.y - 1; }
                if (other.nameTag) { other.nameTag.setPosition(other.x, other.y + 36); other.nameTag.depth = other.y + 1000; }
                if (other.chatBubble) { other.chatBubble.setPosition(other.x, other.y - 50); other.chatBubble.depth = 9999; }
                if (other.typingBubble) { 
                    other.typingBubble.setPosition(other.x, other.y - 50); 
                    other.typingBubble.depth = 9998; 
                    animateTypingDots(other.typingBubble, time);
                }
            });

            // POLVO AMBIENTAL
            dustParticles.forEach(p => {
                p.y -= p.speedY;
                p.x += Math.sin(time / 500 + p.seed) * 0.35;
                if (p.y < 130) p.y = 670;

                let inSunbeam = false;
                if (p.y >= 120 && p.y <= 480) {
                    const progress = (p.y - 120) / (480 - 120);
                    const minX = 180 + 30 * progress;
                    const maxX = 320 + 180 * progress;
                    if (p.x >= minX && p.x <= maxX) {
                        inSunbeam = true;
                    }
                }

                p.gfx.clear();
                if (inSunbeam) {
                    p.gfx.fillStyle(0xfffbe6, 0.92);
                    p.gfx.fillCircle(p.x, p.y, p.baseSize * 1.5);
                } else {
                    p.gfx.fillStyle(0xffeaa7, 0.35);
                    p.gfx.fillCircle(p.x, p.y, p.baseSize);
                }
            });

            for (let i = footstepDusts.length - 1; i >= 0; i--) {
                const p = footstepDusts[i];
                p.alpha -= 0.04;
                p.scale += 0.03;
                if (p.alpha <= 0) {
                    p.destroy();
                    footstepDusts.splice(i, 1);
                }
            }
        }

        function addLocalPlayer(scene, playerInfo) {
            player = scene.physics.add.sprite(playerInfo.x, playerInfo.y, `human_${playerInfo.color}`);
            player.setScale(2.4);
            player.setCollideWorldBounds(true);
            targetPoint = new Phaser.Math.Vector2(player.x, player.y);

            player.shadow = scene.add.image(player.x, player.y + 28, 'avatar_shadow');

            player.nameTag = scene.add.text(player.x, player.y + 36, playerInfo.name, {
                fontSize: '11px', fill: '#f1c40f', backgroundColor: '#140d0bdd',

        function addOtherPlayer(scene, playerInfo) {

            other.targetPoint = new Phaser.Math.Vector2(playerInfo.x, playerInfo.y);

            other.shadow = scene.add.image(playerInfo.x, playerInfo.y + 28, 'avatar_shadow');

            other.nameTag = scene.add.text(other.x, other.y + 36, playerInfo.name, {
                fontSize: '11px', fill: '#ffffff', backgroundColor: '#140d0bdd',
                padding: { x: 6, y: 3 }, fontFamily: 'Silkscreen'
            }).setOrigin(0.5, 0.5);

        function setTypingIndicator(scene, playerId, isTyping) {
            const char = (socket && playerId === socket.id) ? player : otherPlayers[playerId];
            if (!char) return;

            if (isTyping) {
                if (!char.typingBubble && !char.chatBubble) {
                    const bubbleContainer = scene.add.container(char.x, char.y - 50);
                    
                    const bg = scene.add.graphics();
                    bg.fillStyle(0xfffdfa, 0.95);
                    bg.fillRoundedRect(-18, -11, 36, 22, 6);
                    bg.lineStyle(2, 0xb87333, 1);
                    bg.strokeRoundedRect(-18, -11, 36, 22, 6);

                    const dots = scene.add.text(0, -1, '...', {
                        fontSize: '13px', fill: '#d35400', fontFamily: 'Silkscreen', fontWeight: 'bold'
                    }).setOrigin(0.5, 0.5);

                    bubbleContainer.add([bg, dots]);
                    bubbleContainer.dotsText = dots;
                    char.typingBubble = bubbleContainer;
                }
            } else {
                if (char.typingBubble) {
                    char.typingBubble.destroy();
                    char.typingBubble = null;
                }
            }
        }

        function animateTypingDots(container, time) {
            if (container && container.dotsText) {
                const count = Math.floor((time / 300) % 3) + 1;
                container.dotsText.setText('.'.repeat(count));

            if (!char) return;
            if (char.typingBubble) { char.typingBubble.destroy(); char.typingBubble = null; }

        }

            const char = (socket && playerId === socket.id) ? player : otherPlayers[playerId];

            const msgText = scene.add.text(0, 0, text, {
                fontSize: '11px', fill: '#2c3e50', fontFamily: 'Silkscreen'
            }).setOrigin(0.5, 0.5);

            const w = msgText.width + 18;
            const h = msgText.height + 14;

            const bg = scene.add.graphics();
            bg.fillStyle(0xfffdfa, 0.98);
            bg.fillRoundedRect(-w / 2, -h / 2, w, h, 6);
            bg.lineStyle(2, 0xb87333, 1);
            bg.strokeRoundedRect(-w / 2, -h / 2, w, h, 6);

            bubbleContainer.add([bg, msgText]);
            char.chatBubble = bubbleContainer;

            scene.time.delayedCall(4500, () => {

                }

        // --- AUDIO DE LLUVIA SINTETIZADO ---
        function initRainAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                const bufferSize = audioContext.sampleRate * 2;
                const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const output = noiseBuffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * 0.015;
                }

                rainNoiseNode = audioContext.createBufferSource();
                rainNoiseNode.buffer = noiseBuffer;
                rainNoiseNode.loop = true;

                const filter = audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 550;

                rainNoiseNode.connect(filter);
                filter.connect(audioContext.destination);
                rainNoiseNode.start();
                isAudioPlaying = true;
            } catch(e) {
                console.log("Audio no disponible");
            }
        }

        async function toggleAudio() {
            if (!audioContext) return;
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
                isAudioPlaying = true;
                document.getElementById('audio-toggle-btn').innerText = '🌧️';
            } else if (audioContext.state === 'running') {
                await audioContext.suspend();
                isAudioPlaying = false;
                document.getElementById('audio-toggle-btn').innerText = '🔇';
            }
        }

        function toggleHistory() {
            const box = document.getElementById('chat-history-box');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function addHistoryLog(name, message) {
            const list = document.getElementById('chat-history-list');
            const item = document.createElement('div');
            
            const nameEl = document.createElement('b');
            nameEl.style.color = '#2ecc71';
            nameEl.textContent = `${name}: `;
            
            const msgEl = document.createElement('span');
            msgEl.textContent = message;

            item.appendChild(nameEl);
            item.appendChild(msgEl);
            list.appendChild(item);
            list.scrollTop = list.scrollHeight;
        }
